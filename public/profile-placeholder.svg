<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4717F6" />
      <stop offset="100%" stop-color="#A239CA" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base: VOID -->
  <rect width="400" height="400" rx="32" fill="#0E0B16" />
  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="#4717F6" stroke-width="2" stroke-opacity="0.4" />

  <!-- Subtle grid lines in JEWEL/VOID -->
  <g opacity="0.25" stroke="#4717F6" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Orbit Rings -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#purpleRing)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="#A239CA" stroke-width="1" stroke-dasharray="3 12" opacity="0.35" />

  <!-- Center Circle in Dark Purple Card Surface -->
  <circle cx="200" cy="180" r="85" fill="#151022" stroke="url(#purpleRing)" stroke-width="2.5" filter="url(#purpleGlow)" />

  <!-- Initials "HP" in STARK with Fuschia glow -->
  <text x="200" y="202" font-family="'Sora', sans-serif" font-size="64" font-weight="700" fill="#E7DFDD" text-anchor="middle" letter-spacing="2">HP</text>

  <!-- Bottom Badge: Name & Role -->
  <rect x="65" y="300" width="270" height="42" rx="21" fill="#151022" stroke="#4717F6" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Fuschia Status Pulse -->
  <circle cx="90" cy="321" r="5" fill="#A239CA" />
  <circle cx="90" cy="321" r="8" fill="#A239CA" opacity="0.3" />
  
  <text x="108" y="326" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#E7DFDD">Harshwardhan Pal</text>
  <text x="260" y="326" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#A239CA">• Analyst</text>

  <!-- Floating Data Accents -->
  <circle cx="100" cy="110" r="4" fill="#A239CA" />
  <circle cx="310" cy="130" r="5" fill="#4717F6" />
  <circle cx="290" cy="250" r="4" fill="#E7DFDD" />
</svg>
