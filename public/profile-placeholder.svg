<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Decorative Orbit Rings -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 12" opacity="0.25" />

  <!-- Glowing Center Circle -->
  <circle cx="200" cy="180" r="85" fill="#1E293B" fill-opacity="0.9" stroke="url(#ringGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Initials "HP" -->
  <text x="200" y="202" font-family="'Sora', sans-serif, system-ui" font-size="64" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">HP</text>

  <!-- Bottom Badge: Name & Role -->
  <rect x="70" y="300" width="260" height="42" rx="21" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  
  <!-- Pulse Indicator -->
  <circle cx="94" cy="321" r="5" fill="#10B981" />
  <circle cx="94" cy="321" r="8" fill="#10B981" opacity="0.3" />
  
  <text x="112" y="326" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Harshwardhan Pal</text>
  <text x="260" y="326" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">• Analyst</text>

  <!-- Floating Data Node Accent -->
  <circle cx="100" cy="110" r="4" fill="#3B82F6" />
  <circle cx="310" cy="130" r="5" fill="#8B5CF6" />
  <circle cx="290" cy="250" r="4" fill="#06B6D4" />
</svg>
