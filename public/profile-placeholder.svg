<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="50%" stop-color="#EFE6DA" />
      <stop offset="100%" stop-color="#E2D4C3" />
    </linearGradient>
    <linearGradient id="goldBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B714B" />
      <stop offset="100%" stop-color="#643F23" />
    </linearGradient>
    <linearGradient id="accentBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E5331" />
      <stop offset="100%" stop-color="#462A16" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#warmBg)" />
  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="#D8C8B6" stroke-width="2" />

  <!-- Subtle grid lines in warm sand -->
  <g opacity="0.3" stroke="#C4B09C" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Decorative Orbit Rings -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#goldBrown)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="#B89370" stroke-width="1" stroke-dasharray="3 12" opacity="0.4" />

  <!-- Center Circle in Crisp White -->
  <circle cx="200" cy="180" r="85" fill="#FFFFFF" stroke="url(#accentBrown)" stroke-width="3" />

  <!-- Initials "HP" in Rich Espresso -->
  <text x="200" y="202" font-family="'Sora', sans-serif" font-size="64" font-weight="700" fill="url(#accentBrown)" text-anchor="middle" letter-spacing="2">HP</text>

  <!-- Bottom Badge: Name & Role -->
  <rect x="65" y="300" width="270" height="42" rx="21" fill="#FFFFFF" stroke="#D8C8B6" stroke-width="1" />
  
  <!-- Warm Pulse Indicator -->
  <circle cx="90" cy="321" r="5" fill="#9B714B" />
  <circle cx="90" cy="321" r="8" fill="#9B714B" opacity="0.25" />
  
  <text x="108" y="326" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#2A170B">Harshwardhan Pal</text>
  <text x="260" y="326" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#7E5331">• Analyst</text>

  <!-- Floating Data Accents -->
  <circle cx="100" cy="110" r="5" fill="#9B714B" />
  <circle cx="310" cy="130" r="5" fill="#7E5331" />
  <circle cx="290" cy="250" r="4" fill="#B89370" />
</svg>
