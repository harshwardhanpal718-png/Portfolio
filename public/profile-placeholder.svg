  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="#E4E4E7" stroke-width="2" />

  <!-- Subtle Radial Frame -->
  <circle cx="200" cy="160" r="70" fill="#E4E4E7" opacity="0.6" />

