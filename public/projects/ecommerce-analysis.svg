  <rect x="50" y="370" width="300" height="76" rx="10" fill="#F5F0E9" stroke="#EBE5DC" />
  <text x="60" y="392" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A98468">df['RFM_Score'] = r_score*100 + f_score*10 + m_score</text>
  <text x="60" y="410" font-family="'JetBrains Mono', monospace" font-size="10" fill="#171923">kmeans = KMeans(n_clusters=4, random_state=42)</text>
  <text x="60" y="428" font-family="'JetBrains Mono', monospace" font-size="10" fill="#62616A">df['Segment'] = kmeans.fit_predict(scaled_features)</text>

