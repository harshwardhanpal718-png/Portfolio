<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" rx="20" fill="#FAF7F2" />
  <rect x="1" y="1" width="798" height="498" rx="19" fill="none" stroke="#EBE5DC" stroke-width="2" />

  <!-- Window Header Bar -->
