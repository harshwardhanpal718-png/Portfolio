  <text x="535" y="415" font-family="'Inter', sans-serif" font-size="11" fill="#171923">• Enterprise Tech (58%)</text>
  <text x="535" y="435" font-family="'Inter', sans-serif" font-size="11" fill="#62616A">• Office Supplies (29%)</text>
