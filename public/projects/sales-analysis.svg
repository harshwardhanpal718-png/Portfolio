<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="crimsonBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E31B32" />
      <stop offset="100%" stop-color="#7A0A16" />
    </linearGradient>
    <linearGradient id="crimsonLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C81024" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#080808" />
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#242424" stroke-width="2" />

  <!-- Ambient red glow -->
  <circle cx="200" cy="180" r="160" fill="#C81024" opacity="0.08" filter="blur(50px)" />
  <circle cx="680" cy="360" r="140" fill="#C81024" opacity="0.06" filter="blur(50px)" />

  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="46" fill="#0D0D0D" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#242424" />
  <circle cx="28" cy="23" r="5" fill="#C81024" />
  <circle cx="44" cy="23" r="5" fill="#404040" />
  <circle cx="60" cy="23" r="5" fill="#242424" />
  <text x="400" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A1A1AA" text-anchor="middle" font-weight="600">Sales_Performance_Diagnostic.pbix — Power BI &amp; SQL</text>

  <!-- KPI row -->
  <rect x="30" y="68" width="168" height="76" fill="#0F0F0F" stroke="#242424" />
  <text x="45" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">Total Gross Revenue</text>
  <text x="45" y="122" font-family="'Bebas Neue', sans-serif" font-size="28" fill="#FFFFFF">$2.45M</text>

  <rect x="218" y="68" width="168" height="76" fill="#0F0F0F" stroke="#242424" />
  <text x="233" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">YoY Growth</text>
  <text x="233" y="122" font-family="'Bebas Neue', sans-serif" font-size="28" fill="#C81024">+14.2%</text>

  <rect x="406" y="68" width="168" height="76" fill="#0F0F0F" stroke="#242424" />
  <text x="421" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">Gross Margin %</text>
  <text x="421" y="122" font-family="'Bebas Neue', sans-serif" font-size="28" fill="#FFFFFF">28.4%</text>

  <rect x="594" y="68" width="176" height="76" fill="#0F0F0F" stroke="#242424" />
  <text x="609" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">Avg Order Value</text>
  <text x="609" y="122" font-family="'Bebas Neue', sans-serif" font-size="28" fill="#C81024">$184.20</text>

  <!-- Main Chart: Monthly Sales Volume -->
  <rect x="30" y="164" width="460" height="305" fill="#0F0F0F" stroke="#242424" />
  <text x="50" y="196" font-family="'Bebas Neue', sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="1">MONTHLY REVENUE &amp; TARGET HORIZON</text>
  <text x="50" y="214" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">24-month trend with seasonal peak analysis</text>

  <!-- Grid lines -->
  <line x1="50" y1="248" x2="470" y2="248" stroke="#1A1A1A" />
  <line x1="50" y1="305" x2="470" y2="305" stroke="#1A1A1A" />
  <line x1="50" y1="362" x2="470" y2="362" stroke="#1A1A1A" />
  <line x1="50" y1="420" x2="470" y2="420" stroke="#242424" />

  <!-- Bar Charts in Crimson Gradient -->
  <rect x="70" y="340" width="22" height="80" fill="#33060B" />
  <rect x="105" y="320" width="22" height="100" fill="#4D0910" />
  <rect x="140" y="300" width="22" height="120" fill="#660C16" />
  <rect x="175" y="270" width="22" height="150" fill="url(#crimsonBarGrad)" />
  <rect x="210" y="290" width="22" height="130" fill="url(#crimsonBarGrad)" />
  <rect x="245" y="250" width="22" height="170" fill="url(#crimsonBarGrad)" />
  <rect x="280" y="230" width="22" height="190" fill="#C81024" />
  <rect x="315" y="260" width="22" height="160" fill="url(#crimsonBarGrad)" />
  <rect x="350" y="220" width="22" height="200" fill="#C81024" />
  <rect x="385" y="190" width="22" height="230" fill="#E31B32" />
  <rect x="420" y="240" width="22" height="180" fill="url(#crimsonBarGrad)" />

  <!-- Trendline in white/crimson -->
  <path d="M 80 330 Q 180 260 280 230 T 430 200" fill="none" stroke="url(#crimsonLineGrad)" stroke-width="3" />
  <circle cx="385" cy="190" r="4.5" fill="#FFFFFF" stroke="#C81024" stroke-width="2" />

  <!-- Right Chart: Category Breakdown -->
  <rect x="510" y="164" width="260" height="305" fill="#0F0F0F" stroke="#242424" />
  <text x="530" y="196" font-family="'Bebas Neue', sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="1">CATEGORY MIX</text>
  <text x="530" y="214" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">Revenue contribution</text>

  <!-- Category 1: Tech -->
  <text x="530" y="252" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Technology (48%)</text>
  <rect x="530" y="262" width="220" height="8" fill="#1C1C1C" />
  <rect x="530" y="262" width="105" height="8" fill="#C81024" />

  <!-- Category 2: Office Supplies -->
  <text x="530" y="312" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Office Supplies (31%)</text>
  <rect x="530" y="322" width="220" height="8" fill="#1C1C1C" />
  <rect x="530" y="322" width="68" height="8" fill="#E31B32" />

  <!-- Category 3: Furniture -->
  <text x="530" y="372" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Furniture (21%)</text>
  <rect x="530" y="382" width="220" height="8" fill="#1C1C1C" />
  <rect x="530" y="382" width="46" height="8" fill="#4D0910" />

  <!-- Footer note -->
  <text x="530" y="440" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C81024" font-weight="700">✦ Tech driving 62% of margin</text>
</svg>
