  <text x="145" y="125" font-family="'Inter', sans-serif" font-size="10" fill="#2E7D32" font-weight="700">+14.2%</text>

  <rect x="220" y="65" width="170" height="80" rx="14" fill="#F9EBDD" stroke="#EBE5DC" />
