  <text x="50" y="206" font-family="'Inter', sans-serif" font-size="11" fill="#62616A">Actual vs Projected Financial Velocity</text>

  <!-- Area Graphic -->
  <path d="M 50 380 Q 110 320, 160 340 T 260 270 T 360 250 T 450 220 L 450 420 L 50 420 Z" fill="#F9EBDD" opacity="0.6" />
  <path d="M 50 380 Q 110 320, 160 340 T 260 270 T 360 250 T 450 220" fill="none" stroke="#A98468" stroke-width="3" />
  
  <path d="M 50 400 Q 110 370, 160 380 T 260 330 T 360 310 T 450 290" fill="none" stroke="#171923" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Data Nodes -->
  <circle cx="160" cy="340" r="4.5" fill="#A98468" />
  <circle cx="260" cy="270" r="4.5" fill="#A98468" />
  <circle cx="360" cy="250" r="4.5" fill="#A98468" />
  <circle cx="450" cy="220" r="5" fill="#171923" />

