  <circle cx="640" cy="300" r="65" fill="none" stroke="#F5F0E9" stroke-width="22" />
  <circle cx="640" cy="300" r="65" fill="none" stroke="#A98468" stroke-width="22" stroke-dasharray="240 410" stroke-dashoffset="0" />
  <circle cx="640" cy="300" r="65" fill="none" stroke="#DCE9DF" stroke-width="22" stroke-dasharray="120 410" stroke-dashoffset="-240" />

  <text x="640" y="296" font-family="'Inter', sans-serif" font-size="11" fill="#62616A" text-anchor="middle">TOP CATEGORY</text>
  <text x="640" y="320" font-family="'Playfair Display', serif" font-size="20" fill="#171923" font-weight="800" text-anchor="middle">58%</text>

