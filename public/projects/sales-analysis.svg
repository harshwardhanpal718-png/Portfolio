<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#0F172A" />
  <circle cx="28" cy="22" r="5" fill="#EF4444" />
  <circle cx="44" cy="22" r="5" fill="#F59E0B" />
  <circle cx="60" cy="22" r="5" fill="#10B981" />
  <text x="400" y="27" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle" font-weight="500">Sales_Performance_BI_Dashboard.pbix — Power BI & SQL</text>

  <!-- KPI Cards -->
  <!-- Card 1: Total Revenue -->
  <rect x="30" y="64" width="225" height="85" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="48" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" font-weight="500">Gross Revenue (YTD)</text>
  <text x="48" y="125" font-family="'Sora', sans-serif" font-size="24" fill="#F8FAFC" font-weight="700">$2.45M</text>
  <rect x="180" y="80" width="55" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" />
  <text x="207" y="95" font-family="'Inter', sans-serif" font-size="11" fill="#34D399" text-anchor="middle" font-weight="600">+14.2%</text>

  <!-- Card 2: Profit Margin -->
  <rect x="285" y="64" width="225" height="85" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="303" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" font-weight="500">Net Profit Margin</text>
  <text x="303" y="125" font-family="'Sora', sans-serif" font-size="24" fill="#60A5FA" font-weight="700">28.4%</text>
  <rect x="435" y="80" width="55" height="22" rx="11" fill="rgba(59, 130, 246, 0.15)" />
  <text x="462" y="95" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA" text-anchor="middle" font-weight="600">+3.1%</text>

  <!-- Card 3: Avg Order Value -->
  <rect x="540" y="64" width="230" height="85" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="558" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" font-weight="500">Avg Order Value (AOV)</text>
  <text x="558" y="125" font-family="'Sora', sans-serif" font-size="24" fill="#A78BFA" font-weight="700">$184.20</text>
  <rect x="695" y="80" width="55" height="22" rx="11" fill="rgba(139, 92, 246, 0.15)" />
  <text x="722" y="95" font-family="'Inter', sans-serif" font-size="11" fill="#A78BFA" text-anchor="middle" font-weight="600">+6.8%</text>

  <!-- Main Chart Area (Revenue Trend) -->
  <rect x="30" y="170" width="480" height="295" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="52" y="202" font-family="'Sora', sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Monthly Revenue Velocity & Target Tracking</text>
  <text x="52" y="222" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Actual vs Budgeted Target (Jan - Dec 2024)</text>

  <!-- Chart Gridlines -->
  <line x1="52" y1="260" x2="480" y2="260" stroke="#1F2937" stroke-dasharray="3 3" />
  <line x1="52" y1="310" x2="480" y2="310" stroke="#1F2937" stroke-dasharray="3 3" />
  <line x1="52" y1="360" x2="480" y2="360" stroke="#1F2937" stroke-dasharray="3 3" />
  <line x1="52" y1="410" x2="480" y2="410" stroke="#1F2937" />

  <!-- Area & Line Graph -->
  <polygon points="65,410 95,380 135,390 175,340 215,350 255,290 295,310 335,260 375,270 415,230 455,215 455,410" fill="url(#areaFill)" />
  <polyline points="65,410 95,380 135,390 175,340 215,350 255,290 295,310 335,260 375,270 415,230 455,215" fill="none" stroke="#3B82F6" stroke-width="3" />
  
  <!-- Target Line -->
  <polyline points="65,390 135,370 215,330 295,300 375,260 455,240" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5 4" />

  <!-- Data Points -->
  <circle cx="255" cy="290" r="4" fill="#38BDF8" stroke="#0F172A" stroke-width="2" />
  <circle cx="335" cy="260" r="4" fill="#38BDF8" stroke="#0F172A" stroke-width="2" />
  <circle cx="415" cy="230" r="4" fill="#38BDF8" stroke="#0F172A" stroke-width="2" />
  <circle cx="455" cy="215" r="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2" />

  <!-- Secondary Side Chart (Regional Distribution) -->
  <rect x="530" y="170" width="240" height="295" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="550" y="202" font-family="'Sora', sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Regional Performance</text>
  <text x="550" y="222" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Share of Total Revenue</text>

  <!-- Horizontal Bars -->
  <!-- North -->
  <text x="550" y="260" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">North America</text>
  <text x="735" y="260" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">38%</text>
  <rect x="550" y="270" width="180" height="10" rx="5" fill="#1E293B" />
  <rect x="550" y="270" width="137" height="10" rx="5" fill="#3B82F6" />

  <!-- Europe -->
  <text x="550" y="315" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Europe</text>
  <text x="735" y="315" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">29%</text>
  <rect x="550" y="325" width="180" height="10" rx="5" fill="#1E293B" />
  <rect x="550" y="325" width="104" height="10" rx="5" fill="#8B5CF6" />

  <!-- Asia Pacific -->
  <text x="550" y="370" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Asia Pacific</text>
  <text x="735" y="370" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">21%</text>
  <rect x="550" y="380" width="180" height="10" rx="5" fill="#1E293B" />
  <rect x="550" y="380" width="76" height="10" rx="5" fill="#06B6D4" />

  <!-- Latin America -->
  <text x="550" y="425" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Latin America</text>
  <text x="735" y="425" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">12%</text>
  <rect x="550" y="435" width="180" height="10" rx="5" fill="#1E293B" />
  <rect x="550" y="435" width="43" height="10" rx="5" fill="#F59E0B" />
</svg>
