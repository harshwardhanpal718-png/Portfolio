  <rect x="600" y="65" width="170" height="80" rx="14" fill="#E5EEF8" stroke="#D2E2F2" />
  <text x="615" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#1565C0">AVG BASKET SIZE</text>
  <text x="615" y="125" font-family="'Playfair Display', serif" font-size="24" fill="#171923" font-weight="800">$56.30</text>
  <text x="735" y="125" font-family="'Inter', sans-serif" font-size="10" fill="#1565C0" font-weight="700">+3.1%</text>

  <!-- Left Chart: Monthly Sales vs Target -->
  <rect x="30" y="160" width="460" height="305" rx="16" fill="#FFFFFF" stroke="#EBE5DC" />
