<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141F" />
      <stop offset="100%" stop-color="#060A10" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg5)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#132B45" stroke-width="2" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#0C1B2A" />
  <circle cx="28" cy="22" r="5" fill="#EF4444" />
  <circle cx="44" cy="22" r="5" fill="#F59E0B" />
  <circle cx="60" cy="22" r="5" fill="#10B981" />
  <text x="400" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8" text-anchor="middle">student_academic_factors_regression.sql &amp; py — Statistical Modeling</text>

  <!-- Left Card: Test Prep Impact -->
  <rect x="30" y="64" width="350" height="400" rx="12" fill="#0E1E30" stroke="#1E3A5F" />
  <text x="50" y="96" font-family="'Sora', sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Test Preparation Course Effect</text>
  <text x="50" y="116" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Two-Sample t-test: p &lt; 0.001 (Statistically Significant)</text>

  <!-- Math score bars comparison -->
  <text x="50" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Mathematics Mean Score</text>
  
  <rect x="50" y="172" width="180" height="20" rx="4" fill="#3B82F6" />
  <text x="240" y="187" font-family="'Inter', sans-serif" font-size="11" fill="#93C5FD">Completed Prep: 74.2%</text>

  <rect x="50" y="200" width="150" height="20" rx="4" fill="#334155" />
  <text x="210" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">None: 61.9%</text>

  <!-- Reading score bars -->
  <text x="50" y="250" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Reading Mean Score</text>
  <rect x="50" y="262" width="190" height="20" rx="4" fill="#8B5CF6" />
  <text x="250" y="277" font-family="'Inter', sans-serif" font-size="11" fill="#C4B5FD">Completed Prep: 77.8%</text>

  <rect x="50" y="290" width="156" height="20" rx="4" fill="#334155" />
  <text x="216" y="305" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">None: 64.5%</text>

  <!-- Writing score bars -->
  <text x="50" y="340" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Writing Mean Score</text>
  <rect x="50" y="352" width="195" height="20" rx="4" fill="#06B6D4" />
  <text x="255" y="367" font-family="'Inter', sans-serif" font-size="11" fill="#67E8F9">Completed Prep: 79.4%</text>

  <rect x="50" y="380" width="154" height="20" rx="4" fill="#334155" />
  <text x="214" y="395" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">None: 63.3%</text>

  <!-- Stat highlight -->
  <rect x="50" y="415" width="310" height="35" rx="6" fill="#13263C" />
  <text x="205" y="437" font-family="'Inter', sans-serif" font-size="11" fill="#34D399" text-anchor="middle" font-weight="600">Net Average Exam Uplift: +12.3%</text>

  <!-- Right Card: Factor Correlation Heatmap Matrix -->
  <rect x="400" y="64" width="370" height="400" rx="12" fill="#0E1E30" stroke="#1E3A5F" />
  <text x="420" y="96" font-family="'Sora', sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Correlation Coefficient Matrix</text>
  <text x="420" y="116" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Pearson r correlation with final composite outcome</text>

  <!-- Matrix Table -->
  <g transform="translate(420, 145)">
    <!-- Factor 1: Attendance -->
    <rect x="0" y="0" width="330" height="42" rx="6" fill="#142B44" stroke="#1E3A5F" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" fill="#F8FAFC">Class Attendance Rate (&gt;85%)</text>
    <rect x="255" y="10" width="60" height="22" rx="4" fill="#059669" />
    <text x="285" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">r = 0.72</text>

    <!-- Factor 2: Study Hours -->
    <rect x="0" y="52" width="330" height="42" rx="6" fill="#142B44" stroke="#1E3A5F" />
    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="12" fill="#F8FAFC">Weekly Self-Study Hours</text>
    <rect x="255" y="62" width="60" height="22" rx="4" fill="#10B981" />
    <text x="285" y="77" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">r = 0.65</text>

    <!-- Factor 3: Practice Tests -->
    <rect x="0" y="104" width="330" height="42" rx="6" fill="#142B44" stroke="#1E3A5F" />
    <text x="14" y="130" font-family="'Inter', sans-serif" font-size="12" fill="#F8FAFC">Mock Test Frequency</text>
    <rect x="255" y="114" width="60" height="22" rx="4" fill="#3B82F6" />
    <text x="285" y="129" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">r = 0.58</text>

    <!-- Factor 4: Parental Education -->
    <rect x="0" y="156" width="330" height="42" rx="6" fill="#142B44" stroke="#1E3A5F" />
    <text x="14" y="182" font-family="'Inter', sans-serif" font-size="12" fill="#F8FAFC">Parental Academic Background</text>
    <rect x="255" y="166" width="60" height="22" rx="4" fill="#6366F1" />
    <text x="285" y="181" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">r = 0.36</text>

    <!-- Factor 5: Commute Time -->
    <rect x="0" y="208" width="330" height="42" rx="6" fill="#142B44" stroke="#1E3A5F" />
    <text x="14" y="234" font-family="'Inter', sans-serif" font-size="12" fill="#F8FAFC">Daily Commute Distance</text>
    <rect x="255" y="218" width="60" height="22" rx="4" fill="#DC2626" />
    <text x="285" y="233" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">r = -0.29</text>
  </g>

  <!-- Key Finding Banner -->
  <rect x="420" y="415" width="330" height="35" rx="6" fill="#13263C" />
  <text x="585" y="437" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8" text-anchor="middle" font-weight="500">Attendance &gt; 85% is highest single predictor</text>
</svg>
