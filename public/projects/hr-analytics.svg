<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg3)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#0E1726" />
  <circle cx="28" cy="22" r="5" fill="#EF4444" />
  <circle cx="44" cy="22" r="5" fill="#F59E0B" />
  <circle cx="60" cy="22" r="5" fill="#10B981" />
  <text x="400" y="27" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">HR_Attrition_Workforce_Analytics.pbix — Power BI</text>

  <!-- KPI Row -->
  <rect x="30" y="64" width="168" height="80" rx="10" fill="#111827" stroke="#1F2937" />
  <text x="45" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Total Workforce</text>
  <text x="45" y="122" font-family="'Sora', sans-serif" font-size="22" fill="#F8FAFC" font-weight="700">1,470</text>

  <rect x="218" y="64" width="168" height="80" rx="10" fill="#111827" stroke="#1F2937" />
  <text x="233" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Overall Attrition Rate</text>
  <text x="233" y="122" font-family="'Sora', sans-serif" font-size="22" fill="#F43F5E" font-weight="700">16.1%</text>

  <rect x="406" y="64" width="168" height="80" rx="10" fill="#111827" stroke="#1F2937" />
  <text x="421" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Overtime Attrition</text>
  <text x="421" y="122" font-family="'Sora', sans-serif" font-size="22" fill="#FB923C" font-weight="700">30.5%</text>

  <rect x="594" y="64" width="176" height="80" rx="10" fill="#111827" stroke="#1F2937" />
  <text x="609" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Avg Satisfaction (1-5)</text>
  <text x="609" y="122" font-family="'Sora', sans-serif" font-size="22" fill="#34D399" font-weight="700">3.2 / 5.0</text>

  <!-- Chart 1: Department Attrition Rate -->
  <rect x="30" y="160" width="365" height="305" rx="12" fill="#111827" stroke="#1F2937" />
  <text x="50" y="192" font-family="'Sora', sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Attrition by Department</text>
  <text x="50" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Voluntary departures over past 12 months</text>

  <!-- Sales -->
  <text x="50" y="248" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Sales (446)</text>
  <rect x="170" y="235" width="200" height="18" rx="4" fill="#1E293B" />
  <rect x="170" y="235" width="138" height="18" rx="4" fill="#F43F5E" />
  <text x="315" y="249" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">20.6%</text>

  <!-- R&D -->
  <text x="50" y="298" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">R&amp;D (961)</text>
  <rect x="170" y="285" width="200" height="18" rx="4" fill="#1E293B" />
  <rect x="170" y="285" width="94" height="18" rx="4" fill="#3B82F6" />
  <text x="270" y="299" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">13.8%</text>

  <!-- HR -->
  <text x="50" y="348" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Human Resources (63)</text>
  <rect x="170" y="335" width="200" height="18" rx="4" fill="#1E293B" />
  <rect x="170" y="335" width="126" height="18" rx="4" fill="#8B5CF6" />
  <text x="302" y="349" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">19.0%</text>

  <!-- Department insight badge -->
  <rect x="50" y="385" width="320" height="60" rx="8" fill="#1E293B" />
  <text x="65" y="410" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Core Observation:</text>
  <text x="65" y="428" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0" font-weight="500">Sales representatives face highest turnover at 20.6%</text>

  <!-- Chart 2: Tenure & Overtime Correlation -->
  <rect x="415" y="160" width="355" height="305" rx="12" fill="#111827" stroke="#1F2937" />
  <text x="435" y="192" font-family="'Sora', sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Tenure Curve vs Attrition Risk</text>
  <text x="435" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Critical departure spike at Year 1 - Year 2</text>

  <!-- Tenure Bar Chart -->
  <!-- 0-1 yr -->
  <rect x="450" y="300" width="35" height="80" rx="4" fill="#3B82F6" />
  <text x="467" y="395" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">&lt;1 yr</text>
  <text x="467" y="290" font-family="'Inter', sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">24%</text>

  <!-- 1-2 yr (Critical Peak) -->
  <rect x="505" y="250" width="35" height="130" rx="4" fill="#F43F5E" />
  <text x="522" y="395" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">1-2 yr</text>
  <text x="522" y="240" font-family="'Inter', sans-serif" font-size="10" fill="#F87171" text-anchor="middle" font-weight="700">38% (Peak)</text>

  <!-- 3-5 yr -->
  <rect x="560" y="325" width="35" height="55" rx="4" fill="#3B82F6" />
  <text x="577" y="395" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">3-5 yr</text>
  <text x="577" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">16%</text>

  <!-- 5-10 yr -->
  <rect x="615" y="350" width="35" height="30" rx="4" fill="#3B82F6" />
  <text x="632" y="395" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">5-10 yr</text>
  <text x="632" y="340" font-family="'Inter', sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">9%</text>

  <!-- 10+ yr -->
  <rect x="670" y="365" width="35" height="15" rx="4" fill="#3B82F6" />
  <text x="687" y="395" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">10+ yr</text>
  <text x="687" y="355" font-family="'Inter', sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">4%</text>

  <rect x="435" y="415" width="315" height="35" rx="6" fill="#1E293B" />
  <text x="592" y="437" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8" text-anchor="middle" font-weight="500">Overtime work raises flight probability by 2.8x</text>
</svg>
