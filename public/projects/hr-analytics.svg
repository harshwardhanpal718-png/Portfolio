<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hrCyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7300ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="hrPinkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7300ff" />
      <stop offset="100%" stop-color="#ec38bc" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="#050126" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient light -->
  <circle cx="300" cy="180" r="140" fill="#7300ff" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="300" r="130" fill="#ec38bc" opacity="0.1" filter="blur(40px)" />

  <!-- Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#0c0538" />
  <line x1="0" y1="44" x2="800" y2="44" stroke="rgba(255,255,255,0.08)" />
  <circle cx="28" cy="22" r="5" fill="#ec38bc" />
  <circle cx="44" cy="22" r="5" fill="#7300ff" />
  <circle cx="60" cy="22" r="5" fill="#00f2fe" />
  <text x="400" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle" font-weight="600">HR_Attrition_Workforce_Analytics — Power BI &amp; DAX</text>

  <!-- KPI Row -->
  <rect x="30" y="64" width="168" height="80" rx="10" fill="#0e0742" stroke="rgba(255,255,255,0.08)" />
  <text x="45" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9ca3af">Total Workforce</text>
  <text x="45" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#ffffff" font-weight="800">1,470</text>

  <rect x="218" y="64" width="168" height="80" rx="10" fill="#0e0742" stroke="rgba(255,255,255,0.08)" />
  <text x="233" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9ca3af">Overall Attrition</text>
  <text x="233" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#ec38bc" font-weight="800">16.1%</text>

  <rect x="406" y="64" width="168" height="80" rx="10" fill="#0e0742" stroke="rgba(255,255,255,0.08)" />
  <text x="421" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9ca3af">Overtime Attrition</text>
  <text x="421" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#00f2fe" font-weight="800">30.5%</text>

  <rect x="594" y="64" width="176" height="80" rx="10" fill="#0e0742" stroke="rgba(255,255,255,0.08)" />
  <text x="609" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9ca3af">Avg Satisfaction</text>
  <text x="609" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#d8b4fe" font-weight="800">3.2 / 5.0</text>

  <!-- Chart 1: Department Attrition Rate -->
  <rect x="30" y="160" width="365" height="305" rx="12" fill="#0e0742" stroke="rgba(255,255,255,0.08)" />
  <text x="50" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#ffffff" font-weight="700">Attrition by Department</text>
  <text x="50" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9ca3af">Voluntary departures over past 12 months</text>

  <!-- Sales -->
  <text x="50" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">Sales (446)</text>
  <rect x="170" y="235" width="200" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="170" y="235" width="138" height="18" rx="4" fill="url(#hrPinkGrad)" />
  <text x="315" y="249" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">20.6%</text>

  <!-- R&D -->
  <text x="50" y="298" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">R&amp;D (961)</text>
  <rect x="170" y="285" width="200" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="170" y="285" width="94" height="18" rx="4" fill="#7300ff" />
  <text x="270" y="299" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">13.8%</text>

  <!-- HR -->
  <text x="50" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">Human Resources (63)</text>
  <rect x="170" y="335" width="200" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="170" y="335" width="126" height="18" rx="4" fill="#00f2fe" />
  <text x="302" y="349" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">19.0%</text>

  <!-- Summary note -->
  <rect x="50" y="380" width="325" height="65" rx="8" fill="#130a54" stroke="rgba(255,255,255,0.08)" />
  <text x="64" y="404" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#00f2fe" font-weight="700">✦ Key Finding: Overtime Burden</text>
  <text x="64" y="424" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#9ca3af">Employees working overtime are 2.8x more likely to resign.</text>

  <!-- Chart 2: Experience vs Attrition -->
  <rect x="415" y="160" width="355" height="305" rx="12" fill="#0e0742" stroke="rgba(255,255,255,0.08)" />
  <text x="435" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#ffffff" font-weight="700">Tenure vs Departure Risk</text>
  <text x="435" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9ca3af">Early tenure represents peak departure vulnerability</text>

  <!-- Tenure Bars -->
  <!-- 0-2 yrs -->
  <text x="435" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">0–2 Years</text>
  <rect x="535" y="235" width="215" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="535" y="235" width="175" height="18" rx="4" fill="url(#hrCyanGrad)" />
  <text x="718" y="249" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">34.8%</text>

  <!-- 3-5 yrs -->
  <text x="435" y="298" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">3–5 Years</text>
  <rect x="535" y="285" width="215" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="535" y="285" width="98" height="18" rx="4" fill="#7300ff" />
  <text x="640" y="299" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">15.2%</text>

  <!-- 6-10 yrs -->
  <text x="435" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">6–10 Years</text>
  <rect x="535" y="335" width="215" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="535" y="335" width="62" height="18" rx="4" fill="#00f2fe" opacity="0.7" />
  <text x="605" y="349" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">9.4%</text>

  <!-- 10+ yrs -->
  <text x="435" y="398" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">10+ Years</text>
  <rect x="535" y="385" width="215" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  <rect x="535" y="385" width="40" height="18" rx="4" fill="#ec38bc" opacity="0.6" />
  <text x="583" y="399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" font-weight="700">5.8%</text>

  <text x="600" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ec38bc" text-anchor="middle" font-weight="700">✦ Action: Restructure 90-day onboarding checkpoints</text>
</svg>
